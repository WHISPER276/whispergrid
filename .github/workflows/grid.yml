name: WhisperGrid trade

on:
  schedule:
    - cron: "17 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whispergrid
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Work one grid rung
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
        run: npm run trade

      - name: Save trade log
        run: |
          git config user.name "whispergrid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add logs/trades.json
          git commit -m "trade log $(date -u +%F_%H%M)" || echo "nothing to commit"
          git push
